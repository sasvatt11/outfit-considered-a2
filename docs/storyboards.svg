<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
<title id="title">Three Outfit, considered. interaction examples</title>
<desc id="desc">Three rows of illustrated screens show a casual outfit, a smart-casual dinner correction, and review of optional garment suggestions.</desc>
<defs><style>
  .bg{fill:#f3efe7}.screen{fill:#fffdf8;stroke:#d9d9ce;stroke-width:2}.ink{fill:#232a25}.muted{fill:#627166}.forest{fill:#244e3f}.pale{fill:#e8f0e5}.line{stroke:#d9d9ce;stroke-width:2}.arrow{stroke:#668569;stroke-width:3;fill:none;marker-end:url(#tip)}.label{font:700 15px Arial,sans-serif;fill:#5b695d}.title{font:36px Georgia,serif;fill:#1c3024}.screenhead{font:700 16px Arial,sans-serif;fill:#25382b}.screenbody{font:14px Arial,sans-serif;fill:#4d5c50}.score{font:64px Georgia,serif;fill:#244e3f}.small{font:12px Arial,sans-serif;fill:#536153}.white{fill:#fff}.tag{fill:#dce9d9}.gold{fill:#e7dabe}
</style><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#668569"/></marker></defs>
<rect class="bg" width="1400" height="1080"/>
<text class="title" x="56" y="57">Three moments of interaction</text>
<text class="label" x="56" y="85">Illustrative screens · rule engine and optional three-region garment suggestions are implemented</text>

<text class="screenhead" x="56" y="132">A · A casual outfit that already fits</text>
<g transform="translate(56 152)"><rect class="screen" rx="15" width="372" height="215"/><text class="screenhead" x="21" y="34">Set the scene</text><rect x="20" y="48" width="95" height="34" rx="5" fill="#244e3f"/><text x="32" y="70" class="small white">Casual day</text><rect x="124" y="48" width="92" height="34" rx="5" class="tag"/><text x="140" y="70" class="small">Dinner out</text><rect x="225" y="48" width="113" height="34" rx="5" class="tag"/><text x="241" y="70" class="small">Interview</text><rect x="20" y="99" width="90" height="94" rx="5" fill="#dddcd5"/><path d="M42 115h45l5 19-12 6v43H49v-43l-12-6z" fill="#477ab1"/><rect x="52" y="165" width="25" height="17" fill="#273d59"/><text x="127" y="123" class="screenbody">Open sample photo</text><text x="127" y="148" class="screenbody">Confirm 3 garment labels</text><text x="127" y="173" class="small">Photo + labels can be edited</text></g>
<path class="arrow" d="M440 258h45"/><text class="label" x="453" y="245">score</text>
<g transform="translate(504 152)"><rect class="screen" rx="15" width="372" height="215"/><text class="screenhead" x="21" y="34">Analysis</text><text class="score" x="24" y="104">94</text><text class="small" x="107" y="100">/ 100</text><text x="22" y="135" class="screenbody">Occasion fit</text><rect x="139" y="124" width="190" height="8" rx="4" class="tag"/><rect x="139" y="124" width="190" height="8" rx="4" fill="#789d71"/><text x="22" y="167" class="screenbody">Pairing</text><rect x="139" y="156" width="190" height="8" rx="4" class="tag"/><rect x="139" y="156" width="178" height="8" rx="4" fill="#789d71"/><text x="22" y="193" class="small">Visible reasons, not only a number</text></g>
<path class="arrow" d="M888 258h45"/><text class="label" x="897" y="245">review</text>
<g transform="translate(952 152)"><rect class="screen" rx="15" width="372" height="215"/><text class="screenhead" x="21" y="34">One change to explore</text><rect x="20" y="54" width="332" height="113" rx="9" class="pale"/><text x="35" y="84" class="screenbody">No worthwhile single-item change</text><text x="35" y="111" class="small">Keep the outfit if it feels right.</text><text x="22" y="194" class="small">The system can remain quiet</text></g>

<line class="line" x1="56" y1="405" x2="1324" y2="405"/>
<text class="screenhead" x="56" y="448">B · Correct a dinner-context mismatch</text>
<g transform="translate(56 468)"><rect class="screen" rx="15" width="372" height="215"/><text class="screenhead" x="21" y="34">Open synthetic sample</text><rect x="20" y="48" width="95" height="34" rx="5" class="tag"/><text x="32" y="70" class="small">Casual day</text><rect x="124" y="48" width="92" height="34" rx="5" fill="#244e3f"/><text x="139" y="70" class="small white">Dinner out</text><rect x="225" y="48" width="113" height="34" rx="5" class="tag"/><text x="240" y="70" class="small">Interview</text><text x="20" y="112" class="screenbody">Printed T-shirt · shorts</text><text x="20" y="139" class="screenbody">Casual flip-flops</text><text x="20" y="174" class="small">Review editable labels</text><text x="20" y="196" class="small">Dinner assumes smart casual</text></g>
<path class="arrow" d="M440 574h45"/><text class="label" x="453" y="560">score</text>
<g transform="translate(504 468)"><rect class="screen" rx="15" width="372" height="215"/><text class="screenhead" x="21" y="34">Analysis</text><text class="score" x="24" y="104">50</text><text class="small" x="107" y="100">/ 100</text><text x="22" y="138" class="screenbody">Occasion fit</text><rect x="139" y="127" width="190" height="8" rx="4" class="tag"/><rect x="139" y="127" width="67" height="8" rx="4" fill="#789d71"/><text x="22" y="173" class="screenbody">Pairing</text><rect x="139" y="162" width="190" height="8" rx="4" class="tag"/><rect x="139" y="162" width="152" height="8" rx="4" fill="#789d71"/><text x="22" y="197" class="small">Occasion cap; colours cannot offset it</text></g>
<path class="arrow" d="M888 574h45"/><text class="label" x="895" y="560">preview</text>
<g transform="translate(952 468)"><rect class="screen" rx="15" width="372" height="215"/><text class="screenhead" x="21" y="34">Try one swap</text><rect x="20" y="53" width="332" height="115" rx="9" class="pale"/><text x="35" y="84" class="screenbody">T-shirt → knitwear</text><text x="35" y="116" class="screenbody">50 → 60</text><rect x="35" y="132" width="93" height="25" rx="4" fill="#244e3f"/><text x="61" y="149" class="small white">Undo</text><text x="22" y="195" class="small">Photo itself never changes</text></g>

<line class="line" x1="56" y1="721" x2="1324" y2="721"/>
<text class="screenhead" x="56" y="764">C · Review what the model found</text>
<g transform="translate(56 784)"><rect class="screen" rx="15" width="372" height="215"/><text class="screenhead" x="21" y="34">Upload a photo</text><rect x="20" y="51" width="93" height="112" rx="5" fill="#d8d9d3"/><path d="M42 70h45l5 19-12 5v59H49V94l-12-5z" fill="#477ab1"/><text x="131" y="77" class="screenbody">Request suggestions</text><text x="131" y="106" class="small">Optional model download</text><text x="131" y="137" class="small">Photo stays in browser</text><text x="20" y="191" class="small">Manual entry remains available</text></g>
<path class="arrow" d="M440 890h45"/><text class="label" x="447" y="875">guess</text>
<g transform="translate(504 784)"><rect class="screen" rx="15" width="372" height="215"/><text class="screenhead" x="21" y="34">Review suggestions</text><rect x="20" y="51" width="93" height="112" rx="5" fill="#d8d9d3"/><path d="M42 70h45l5 19-12 5v59H49V94l-12-5z" fill="#477ab1"/><circle cx="66" cy="102" r="12" fill="none" stroke="white" stroke-width="4"/><text x="131" y="83" class="screenbody">Blouse · trousers · shoes</text><text x="131" y="113" class="small">Three region-level guesses</text><text x="131" y="141" class="small">Blazer can be missed</text><text x="20" y="191" class="small">Choose or reject each guess</text></g>
<path class="arrow" d="M888 890h45"/><text class="label" x="895" y="875">correct</text>
<g transform="translate(952 784)"><rect class="screen" rx="15" width="372" height="215"/><text class="screenhead" x="21" y="34">Complete the outfit</text><rect x="20" y="57" width="330" height="48" rx="7" class="pale"/><circle cx="42" cy="81" r="10" fill="#477ab1"/><text x="64" y="87" class="screenbody">Add blazer + colours</text><text x="20" y="141" class="screenbody">Then reveal the score</text><text x="20" y="171" class="small">Nothing inferred is final</text></g>
<text x="56" y="1044" class="label">Illustrated states from developed interactions; the dinner sample is synthetic and uses prefilled labels.</text>
</svg>
