<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 650" role="img" aria-labelledby="title desc">
<title id="title">Outfit, considered. system architecture</title>
<desc id="desc">A local photo preview feeds optional browser-run CLIP garment suggestions and a pixel colour sampler. The person confirms editable garment facts and sets occasion, season and style context for a rule engine. A separate user-picked skin colour produces descriptive contrast only. Model files are downloaded, while photos remain local.</desc>
<defs><style>.bg{fill:#f3efe7}.box{fill:#fffdf8;stroke:#38654a;stroke-width:2}.soft{fill:#e8f0e5;stroke:#38654a;stroke-width:2}.external{fill:#faf8f2;stroke:#89998a;stroke-width:2;stroke-dasharray:7 5}.title{font:700 24px Arial,sans-serif;fill:#25382b}.legend{font:14px Arial,sans-serif;fill:#5c6c60}.node{font:700 17px Arial,sans-serif;fill:#25382b}.sub{font:13px Arial,sans-serif;fill:#5b6a5f}.line{stroke:#597e5f;stroke-width:2.5;fill:none;marker-end:url(#tip)}.data{stroke:#89998a;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#tip)}.flow{font:12px Arial,sans-serif;fill:#4b6750}</style><marker id="tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#597e5f"/></marker></defs>
<rect class="bg" width="1380" height="650"/>
<text class="title" x="40" y="48">System architecture</text><text class="legend" x="40" y="74">Solid = implemented interaction · Dashed = external model download · No photo leaves the browser</text>

<rect class="external" x="40" y="115" width="190" height="80" rx="12"/><text class="node" x="60" y="148">Model files</text><text class="sub" x="60" y="173">downloaded on request</text>
<rect class="soft" x="40" y="270" width="190" height="92" rx="12"/><text class="node" x="60" y="306">Photo preview</text><text class="sub" x="60" y="330">browser memory only</text>
<rect class="box" x="40" y="470" width="190" height="92" rx="12"/><text class="node" x="60" y="505">Person</text><text class="sub" x="60" y="529">chooses · checks · corrects</text>

<rect class="soft" x="290" y="175" width="220" height="90" rx="12"/><text class="node" x="310" y="210">CLIP suggestions</text><text class="sub" x="310" y="235">three image regions</text>
<rect class="soft" x="290" y="320" width="220" height="90" rx="12"/><text class="node" x="310" y="355">Colour sampler</text><text class="sub" x="310" y="380">user-picked garment pixel</text>
<rect class="soft" x="290" y="470" width="220" height="92" rx="12"/><text class="node" x="310" y="505">Skin-area swatch</text><text class="sub" x="310" y="529">descriptive contrast only</text>

<rect class="soft" x="580" y="265" width="220" height="98" rx="12"/><text class="node" x="600" y="302">Editable outfit facts</text><text class="sub" x="600" y="327">confirm, change, add</text>
<rect class="soft" x="580" y="470" width="220" height="92" rx="12"/><text class="node" x="600" y="505">Context input</text><text class="sub" x="600" y="529">occasion · season · style</text>

<rect class="soft" x="870" y="265" width="210" height="98" rx="12"/><text class="node" x="890" y="302">Local rule engine</text><text class="sub" x="890" y="327">score · reasons · swap</text>
<rect class="soft" x="870" y="470" width="210" height="92" rx="12"/><text class="node" x="890" y="505">Own view</text><text class="sub" x="890" y="529">display only</text>

<rect class="soft" x="1150" y="265" width="190" height="98" rx="12"/><text class="node" x="1170" y="302">Result + Undo</text><text class="sub" x="1170" y="327">person reviews advice</text>

<path class="data" d="M230 155 H290"/><text class="flow" x="235" y="143">weights</text>
<path class="line" d="M230 294 C260 294 260 220 290 220"/><text class="flow" x="240" y="210">crops</text>
<path class="line" d="M230 335 C260 335 260 365 290 365"/>
<path class="line" d="M230 342 C260 450 260 510 290 510"/>
<path class="line" d="M510 220 C550 220 550 293 580 293"/><text class="flow" x="520" y="245">guesses</text>
<path class="line" d="M510 365 C545 365 545 334 580 334"/><text class="flow" x="520" y="383">colour</text>
<path class="line" d="M230 510 H260"/><path class="line" d="M230 545 C400 625 525 580 580 535"/>
<path class="line" d="M800 314 H870"/><path class="line" d="M800 510 C835 510 835 340 870 340"/>
<path class="line" d="M1080 314 H1150"/>
<path class="line" d="M1080 510 C1120 510 1120 340 1150 340"/><text class="flow" x="1095" y="502">own view</text>
<path class="line" d="M510 525 C755 620 1065 625 1245 363"/><text class="flow" x="718" y="613">contrast note, no score</text>
</svg>
